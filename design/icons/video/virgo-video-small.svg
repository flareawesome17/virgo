      <stop offset="0" stop-color="#FDD48A"/>
      <stop offset="0.25" stop-color="#F7923A"/>
      <stop offset="0.5" stop-color="#EE5A28"/>
      <stop offset="0.75" stop-color="#DD2A20"/>
      <stop offset="1" stop-color="#B8171D"/>
    </linearGradient>
    <!-- sliver: tip to base -->
