[package]
name = "virgo-desktop"
version = "1.3.0"
description = "Virgo for desktop"
authors = ["Virgo"]
edition = "2021"
rust-version = "1.77.2"

# The shell is a library with a thin binary in front of it, which is what
# `tauri::mobile_entry_point` expects and costs nothing on desktop.
[lib]
name = "virgo_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Finding a server left behind by a previous run. Only ever used to kill a
# process running our own bundled node binary, matched by full path.
[dependencies.sysinfo]
version = "0.39"
default-features = false
features = ["system"]

# Job objects, so the Node child cannot outlive this process even if this
# process is killed rather than closed.
[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61"
features = ["Win32_Foundation", "Win32_System_JobObjects"]

[dependencies]
tauri = { version = "2", features = [] }

# Not used directly. `tauri::generate_context!` expands to code that names
# `serde_json` once tauri.conf.json carries a `plugins` block, and fails to
# compile without it in scope.
serde_json = "1"

# Remembers the window's size and position between launches. Driven entirely
# from Rust, so it needs no capability: the app never calls it from JavaScript,
# which it could not do anyway — the page is served from a loopback address the
# webview treats as remote, and Tauri injects its API only into its own pages.
tauri-plugin-window-state = "2"

# Hands a URL to the system browser. The update notice needs it: a link to the
# installer does nothing in the webview, because Tauri intercepts downloads and
# drops them unless the shell handles them, and handling them here would mean
# reimplementing progress and "where did it go" for a file the browser already
# manages well.
tauri-plugin-opener = "2"

# In-app updates: check, download with progress, install, relaunch. The update
# must carry a signature made with the key whose public half is in
# tauri.conf.json, so a tampered or third-party build is refused before it is
# ever run.
tauri-plugin-updater = "2"
# `relaunch()` after the installer finishes. Nothing else in the app restarts
# the process, so this is the updater's dependency rather than its own feature.
tauri-plugin-process = "2"

# Nothing else. The Node process is started with std::process::Command and the
# webview is moved with `eval`, so neither tauri-plugin-shell nor
# tauri-plugin-http is pulled in.

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
