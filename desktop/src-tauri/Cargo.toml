[package]
name = "virgo-desktop"
version = "1.3.0"
description = "Virgo for desktop"
authors = ["Virgo"]
edition = "2021"
rust-version = "1.77.2"

# The shell is a library with a thin binary in front of it, which is what
# `tauri::mobile_entry_point` expects and costs nothing on desktop.
[lib]
name = "virgo_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

# Remembers the window's size and position between launches. Driven entirely
# from Rust, so it needs no capability: the app never calls it from JavaScript,
# which it could not do anyway — the page is served from a loopback address the
# webview treats as remote, and Tauri injects its API only into its own pages.
tauri-plugin-window-state = "2"

# Nothing else. The Node process is started with std::process::Command and the
# webview is moved with `eval`, so neither tauri-plugin-shell nor
# tauri-plugin-http is pulled in.

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
