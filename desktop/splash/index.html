<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Virgo</title>
    <style>
      /*
       * Shown while the Node server starts, then replaced by the app itself.
       * Colours are the two the mobile app uses for its splash, so the desktop
       * cold start looks like the same product rather than a blank frame.
       */
      :root {
        --bg: #fff8f4;
        --fg: #1e1b18;
        --muted: #847167;
        --accent: #b66a40;
        --track: #ece1d9;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #161311;
          --fg: #f2ede8;
          --muted: #948278;
          --accent: #c17745;
          --track: #2a2320;
        }
      }

      * { box-sizing: border-box; }

      html, body { height: 100%; }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: ui-sans-serif, "Segoe UI", -apple-system, "Helvetica Neue", Arial, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        /* The whole surface drags the window; nothing here is selectable. */
        -webkit-user-select: none;
        user-select: none;
        cursor: default;
      }

      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 22px;
        padding: 32px;
        max-width: 420px;
        text-align: center;
      }

      .mark {
        font-size: 30px;
        font-weight: 600;
        letter-spacing: 0.24em;
        text-indent: 0.24em;
        text-transform: uppercase;
      }

      .track {
        width: 172px;
        height: 2px;
        background: var(--track);
        overflow: hidden;
        border-radius: 2px;
      }
      .track i {
        display: block;
        height: 100%;
        width: 40%;
        background: var(--accent);
        border-radius: 2px;
        animation: slide 1.15s ease-in-out infinite;
      }
      @keyframes slide {
        0%   { transform: translateX(-100%); }
        100% { transform: translateX(350%); }
      }

      .status {
        font-size: 13.5px;
        color: var(--muted);
        margin: 0;
        line-height: 1.5;
      }

      /* Failure state — swapped in by the listener below. */
      body.failed .track { display: none; }
      body.failed .status { color: var(--fg); }

      .detail {
        display: none;
        font-family: ui-monospace, "Cascadia Code", "SF Mono", Consolas, monospace;
        font-size: 11.5px;
        line-height: 1.6;
        color: var(--muted);
        background: var(--track);
        padding: 12px 14px;
        border-radius: 6px;
        max-width: 100%;
        overflow-x: auto;
        text-align: left;
        -webkit-user-select: text;
        user-select: text;
      }
      body.failed .detail { display: block; }

      /*
       * A title bar for the splash. On Windows the window has no frame of its
       * own (the app draws one once it loads), so a start that failed or hung
       * left a window that could not be moved or closed. The strip drags on
       * both systems; the buttons are Windows-only, since macOS keeps its own.
       */
      .bar {
        position: fixed;
        inset: 0 0 auto 0;
        height: 32px;
        display: flex;
        justify-content: flex-end;
      }
      #controls:not([hidden]) { display: flex; }
      .bar button {
        width: 46px;
        height: 32px;
        display: grid;
        place-items: center;
        border: 0;
        background: transparent;
        color: var(--muted);
        cursor: default;
      }
      .bar button:hover { background: var(--track); color: var(--fg); }
      .bar button.close:hover { background: #c42b1c; color: #fff; }
      .bar svg { pointer-events: none; }

      @media (prefers-reduced-motion: reduce) {
        .track i { animation: none; width: 100%; }
      }
    </style>
  </head>
  <body data-tauri-drag-region>
    <div class="bar" data-tauri-drag-region>
      <div id="controls" hidden>
        <button type="button" id="minimise" aria-label="Minimise">
          <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M0 5h10" stroke="currentColor" fill="none" /></svg>
        </button>
        <button type="button" id="close" class="close" aria-label="Close">
          <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M0 0l10 10M10 0L0 10" stroke="currentColor" fill="none" /></svg>
        </button>
      </div>
    </div>
    <main data-tauri-drag-region>
      <div class="mark" data-tauri-drag-region>Virgo</div>
      <div class="track" data-tauri-drag-region><i></i></div>
      <p class="status" id="status" data-tauri-drag-region>Starting…</p>
      <pre class="detail" id="detail"></pre>
    </main>

    <script>
      /*
       * The shell emits `startup-failed` when the server does not come up.
       * Besides listening for it, this page only moves, minimises and closes
       * its own window. Once the server answers, the webview is moved to it
       * and the web app takes over.
       */
      const slow = setTimeout(() => {
        document.getElementById('status').textContent =
          'Still starting — the first launch after an update takes longer.';
      }, 6000);

      // Dragging is the drag-region attribute. Only an element carrying it
      // drags, which is why the failure detail, which can be selected and
      // copied, does not.
      const win = window.__TAURI__?.window?.getCurrentWindow?.();
      if (win && /Windows/.test(navigator.userAgent)) {
        document.getElementById('controls').hidden = false;
        document.getElementById('minimise').onclick = () => win.minimize().catch(() => {});
        // Closing the splash quits the app, server and all, as closing the
        // app window does.
        document.getElementById('close').onclick = () => win.close().catch(() => {});
      }

      window.__TAURI__?.event?.listen('startup-failed', (event) => {
        clearTimeout(slow);
        document.body.classList.add('failed');
        document.getElementById('status').textContent = 'Virgo could not start.';
        document.getElementById('detail').textContent = String(event.payload ?? '');
      });
    </script>
  </body>
</html>
