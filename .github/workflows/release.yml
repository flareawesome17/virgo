# Publishing a GitHub Release builds Virgo and pushes it to GHCR.
#
# The production host never builds. It pulls the images this workflow produced
# and runs them, which is what makes a release a fixed thing you can point at,
# roll forward to, and roll back from.
#
# The desktop app is built here too, but as installers attached to the release
# rather than images — it runs on the user's machine, not the host. See the
# `desktop` job for why it is kept out of the deployable gate.
#
# Mobile is deliberately absent. The Expo app ships through EAS and the native
# app stores; there is no server to run it on and no image to build.
#
# Every action is pinned to a full commit SHA, with the release it came from in
# a comment. A tag can be moved by whoever controls the action's repository and
# a SHA cannot, and these jobs hold credentials that publish what people
# install. Bump them on purpose, not by accident.

name: Release

on:
  release:
    types: [published]
  # Lets a release be rebuilt without cutting a new tag — for a failed run, or
  # a rebuild after fixing the workflow itself. The tag is typed in by hand so
  # it is never ambiguous which release is being rebuilt.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build, e.g. v1.0.0'
        required: true
        type: string
      # For when the release itself is fine and only its installers are not:
      # rebuilds them without touching the images or the deployment marker,
      # so the production host sees nothing new.
      desktop_only:
        description: 'Rebuild only the desktop installers'
        type: boolean
        default: false
      # Submit the Mac app for notarisation without waiting for Apple's answer.
      # Apple can hold an account's first submissions for hours, billed at
      # macOS rates the whole time; once it has cleared one, answers usually
      # take minutes. Gatekeeper checks online until a ticket is stapled, so
      # the app opens normally as soon as Apple accepts it.
      skip_stapling:
        description: 'macOS: do not wait for notarisation to finish'
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    if: ${{ !inputs.desktop_only }}

    # One job per image so a failure names the thing that failed, and so the
    # three build in parallel rather than end to end.
    strategy:
      # false: if the web image fails there is still value in knowing whether
      # the API built. fail-fast would cancel the others and hide that.
      fail-fast: false
      matrix:
        include:
          - name: api
            context: ./api
            image: virgo-api
          - name: web
            context: ./web
            image: virgo-web
          - name: dashboard
            context: ./dashboard
            image: virgo-dashboard

    steps:
      # The tag arrives through the environment, never pasted into the script.
      # Whoever publishes a release types its name, git allows quotes, `$`, `;`
      # and `|` in one, and an interpolated name would run as shell before the
      # check below had the chance to reject it.
      - name: Resolve the release tag
        id: release
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ -z "$TAG" ]; then
            echo "::error::No release tag to build."
            exit 1
          fi
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Release tag must be vMAJOR.MINOR.PATCH; received '$TAG'."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # GHCR paths must be lowercase; a repository owner with capitals
          # otherwise produces a push error that reads like a permissions
          # problem rather than a naming one.
          echo "owner=$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # The release tag, not the default branch. A release is a fixed commit,
      # and building anything else would make the image a lie.
      #
      # Nothing here pushes to git, so the token is not left in .git/config for
      # later steps to find.
      - name: Check out the release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ steps.release.outputs.tag }}
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # The token Actions provides for this run. Scoped to this repository
          # and expires with the job, unlike a personal access token, which is
          # why there is no PAT anywhere in this file.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.image }}
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.release.outputs.owner }}/${{ matrix.image }}:${{ steps.release.outputs.tag }}
          # NEXT_PUBLIC_* values are inlined into the client bundle at build
          # time, so the API URL has to be known here — it cannot be supplied
          # when the container starts. That makes each web/dashboard image
          # specific to the API it was built against; see the note in
          # docs/PRODUCTION_DEPLOYMENT.md before pointing one at another
          # environment.
          #
          # Public values, not secrets: the API URL and the PostHog *project*
          # key both ship to every browser that loads the app. Repository
          # variables rather than hardcoded so a fork or a staging environment
          # can differ without editing this file.
          #
          # Every one falls back to its production value, so a release cut
          # before the repository variables are set still produces a correct
          # production image. The variables exist so a fork or a staging
          # environment can differ without editing this file — not because the
          # defaults are placeholders.
          #
          # SITE_ORIGIN and APP_ORIGIN are ignored by the dashboard build,
          # which declares no such ARG. Passing an undeclared build-arg is a
          # warning, not an error, and one list is easier to keep true than
          # two that drift.
          build-args: |
            APP_VERSION=${{ steps.release.outputs.tag }}
            APP_COMMIT=${{ github.sha }}
            NEXT_PUBLIC_API_URL=${{ vars.PROD_API_URL || 'https://api.virgo.ph' }}
            NEXT_PUBLIC_SITE_ORIGIN=${{ vars.PROD_SITE_ORIGIN || 'https://virgo.ph' }}
            NEXT_PUBLIC_APP_ORIGIN=${{ vars.PROD_APP_ORIGIN || 'https://web.virgo.ph' }}
            NEXT_PUBLIC_POSTHOG_KEY=${{ vars.POSTHOG_KEY }}
            NEXT_PUBLIC_POSTHOG_HOST=${{ vars.POSTHOG_HOST || 'https://us.i.posthog.com' }}
          # Reuses layers between runs, so a release that only touches the web
          # app does not rebuild the API's dependency layer from scratch.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      # The final deployable marker binds the mutable release tag to the exact
      # manifest produced by this successful matrix job. A failed rebuild can
      # therefore never reuse an older marker for partially overwritten tags.
      - name: Record the image digest
        shell: bash
        run: printf '%s\n' '${{ steps.image.outputs.digest }}' > '${{ matrix.image }}.digest'

      - name: Upload the image digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-digest-${{ matrix.image }}
          path: ${{ matrix.image }}.digest
          if-no-files-found: error
          retention-days: 1

  # The desktop app, built on the platform it ships for.
  #
  # Deliberately not part of the `build` matrix, and deliberately not a
  # dependency of `verify`. Those three images are what the production host
  # pulls, and the marker `verify` publishes is what authorises a deployment —
  # a macOS runner failing to compile a webview shell must not be able to stop
  # the server from being deployed. A failed desktop job leaves the release
  # without installers, which is visible on the release page and can be fixed
  # by re-running this job alone.
  #
  # There is no cross-compilation. Tauri links against the platform's own
  # webview — WebView2 on Windows, WKWebView on macOS — so each installer has
  # to be produced on its own runner.
  #
  # macOS is built twice rather than as one universal binary because the app
  # ships a Node runtime, and `stage-web.mjs` takes it from the runner it is
  # executing on. A universal app would carry a single-architecture sidecar and
  # fail on half the Macs that installed it.
  #
  # This job runs code from npm and crates.io, so it can read the repository
  # and nothing more. It hands its installers to `publish-desktop` rather than
  # uploading them itself: whatever a compromised dependency managed here, it
  # could not replace what is on the release page.
  desktop:
    name: desktop (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    # A normal leg takes 10 to 40 minutes, notarisation included. The cap is for
    # one that has stopped making progress: in the first signed release a Mac
    # leg sat in notarisation for over two hours, billed at macOS rates, while
    # every installer waited on it. GitHub's default is six hours.
    timeout-minutes: 75
    permissions:
      contents: read

    strategy:
      # As above: an installer failing on one platform should not hide whether
      # the others built.
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            runner: windows-latest
          - name: macos-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
          # Intel, cross-compiled on the Apple Silicon runner rather than built
          # on a `macos-13` one. Those are no longer being handed out: two
          # consecutive releases sat with this job queued, never picked up, and
          # a job that is never scheduled holds the whole run open until it
          # times out. Xcode targets x86_64 from Apple Silicon without
          # complaint, so nothing is lost by not asking for Intel hardware.
          #
          # The one part that does not cross-compile by itself is the Node
          # sidecar, which `stage-web.mjs` would otherwise copy from the runner
          # — an arm64 binary inside an app only Intel Macs will run. It
          # downloads the matching build instead when VIRGO_TARGET_TRIPLE names
          # a platform it is not running on.
          - name: macos-x64
            runner: macos-latest
            target: x86_64-apple-darwin

    steps:
      # Through the environment, for the reason given in `build`.
      - name: Resolve the release tag
        id: release
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if [ -z "$TAG" ]; then
            echo "::error::No release tag to build."
            exit 1
          fi
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Release tag must be vMAJOR.MINOR.PATCH; received '$TAG'."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # Installer versions are numeric — MSI rejects a leading 'v' outright.
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Check out the release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ steps.release.outputs.tag }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # `targets` installs the cross-compilation target's standard library.
      # Empty for Windows, which builds for the host. `toolchain` has to be
      # named because the action is pinned by SHA: it otherwise reads the
      # channel from the ref, and a SHA is not one.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      # Tauri pulls in several hundred crates. Without this every release
      # compiles them from scratch on three runners.
      - name: Cache the Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: desktop/src-tauri
          key: ${{ matrix.name }}

      # An exact version rather than `^2`: a new tauri-cli should reach the
      # step that builds and signs the installers through a commit here, not
      # on its own. `--locked` holds its dependencies to the ones it shipped
      # with.
      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version 2.11.4 --locked

      # --ignore-scripts: the only install scripts in web's lockfile are
      # core-js's donation banner and unrs-resolver, which only ESLint uses.
      # Skipping them means installing a package cannot run code in a job that
      # is about to handle signing keys. `next build` still runs its
      # dependencies' code, so this narrows that door rather than closing it.
      - name: Install web dependencies
        working-directory: web
        run: npm ci --ignore-scripts

      # tauri.conf.json carries a version so that a local build has one, but a
      # release has to say what it actually is. Taken from the tag rather than
      # kept in step by hand, which is the kind of edit everyone forgets until
      # a user reports the installer showing the wrong number.
      - name: Stamp the release version
        working-directory: desktop/src-tauri
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const config = JSON.parse(fs.readFileSync("tauri.conf.json", "utf8"));
            config.version = process.argv[1];
            fs.writeFileSync("tauri.conf.json", JSON.stringify(config, null, 2) + "\n");
          ' '${{ steps.release.outputs.version }}'

      # Icons are generated from the web app's logo rather than committed, so
      # this step is required, not a convenience — the bundler fails without
      # the .ico and .icns it produces.
      - name: Generate the icons
        working-directory: desktop
        run: cargo tauri icon ../web/public/icon.png

      # Builds web/ in standalone mode and stages it beside a Node runtime for
      # this platform. The API URL is inlined into the client bundle here and
      # cannot be changed afterwards, exactly as for the web image above.
      #
      # This origin must be listed in the API's CORS_ORIGINS or every request
      # from the installed app fails at the preflight; the port is fixed in
      # desktop/src-tauri/src/lib.rs for that reason.
      - name: Stage the web client
        working-directory: desktop
        env:
          VIRGO_API_URL: ${{ vars.PROD_API_URL || 'https://api.virgo.ph' }}
          NEXT_PUBLIC_SITE_ORIGIN: ${{ vars.PROD_SITE_ORIGIN || 'https://virgo.ph' }}
          NEXT_PUBLIC_APP_ORIGIN: ${{ vars.PROD_APP_ORIGIN || 'https://web.virgo.ph' }}
          # Names the Node build to ship. Unset for Windows, where the runner's
          # own runtime is the right one.
          VIRGO_TARGET_TRIPLE: ${{ matrix.target }}
        run: node scripts/stage-web.mjs

      # Both signing identities exist in this step's environment and nowhere
      # else in the job: the updater key that proves an update came from us,
      # and, on the macOS legs only, the Developer ID credentials that sign and
      # notarise the app.
      #
      # The updater key is required, not optional like the Apple credentials:
      # `createUpdaterArtifacts` is on in tauri.conf.json, so a build without it
      # fails rather than quietly producing installers nobody can update from.
      # That is the behaviour we want — an unsigned release would be invisible
      # to every installed copy. It is a minisign keypair, not Authenticode; the
      # public half is embedded in the app and checked before an update is ever
      # run.
      #
      # Tauri signs with Apple whenever APPLE_CERTIFICATE is *set*, even to an
      # empty string, and a secret that has never been configured expands to
      # exactly that. It made unsigned builds fail after a perfectly good
      # compile:
      #
      #   security: SecKeychainItemImport: One or more parameters ... not valid
      #   Error failed to bundle project: failed codesign application:
      #         failed to run command security import
      #
      # So an empty certificate is removed from the environment before the
      # build, and a repository without Apple credentials gets an unsigned .dmg
      # instead of no .dmg at all. Adding the secrets later needs no change
      # here. Windows is unaffected either way: Authenticode is configured in
      # tauri.conf.json under bundle.windows, not by environment.
      - name: Build the installers
        working-directory: desktop
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            echo "Apple certificate present — the build will sign and notarise."
          else
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
              APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
            if [ "$RUNNER_OS" = macOS ]; then
              echo "::notice::macOS build is unsigned; Gatekeeper will quarantine it."
            fi
          fi

          # Notarisation keeps a connection open to Apple for as long as Apple
          # takes, and the first signed release lost it partway through:
          #
          #   failed to notarize app: Error: HTTPError(... NSURLErrorDomain
          #   Code=-1009 "The Internet connection appears to be offline." ...)
          #
          # That says nothing about the build, so it gets two more attempts. The
          # Rust build is compiled by then, so each one repeats only bundling,
          # signing and a fresh submission. Anything else, Apple rejecting the
          # app included, fails at once.
          for attempt in 1 2 3; do
            if cargo tauri build ${{ matrix.target && format('--target {0}', matrix.target) || '' }} ${{ runner.os == 'macOS' && inputs.skip_stapling && '--skip-stapling' || '' }} 2>&1 | tee tauri-build.log; then
              exit 0
            fi
            if [ "$attempt" = 3 ] || ! grep -qE 'failed to notarize.*(NSURLErrorDomain|HTTPError|timed out)' tauri-build.log; then
              exit 1
            fi
            echo "::warning::Notarisation lost its connection to Apple on attempt $attempt; trying again."
          done

      # `nullglob` so the patterns for the other platform expand to nothing
      # rather than to themselves — without it a Windows run would try to
      # collect a file literally named '*.dmg'.
      - name: Collect the installers
        shell: bash
        run: |
          shopt -s nullglob
          # `--target` moves the output under a directory named for the triple.
          # A build without one leaves it at target/release, so both are checked
          # rather than assuming which shape this job produced.
          BUNDLE=desktop/src-tauri/target/release/bundle
          if [ -n "${{ matrix.target }}" ]; then
            BUNDLE="desktop/src-tauri/target/${{ matrix.target }}/release/bundle"
          fi
          # The .sig files are what the updater endpoint reads to prove a
          # download is ours. Without them attached, the API has an installer it
          # cannot vouch for and will not offer the update at all.
          FILES=("$BUNDLE"/msi/*.msi "$BUNDLE"/nsis/*-setup.exe "$BUNDLE"/dmg/*.dmg
                 "$BUNDLE"/nsis/*-setup.exe.sig "$BUNDLE"/msi/*.msi.sig)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "::error::The build reported success but produced no installers."
            exit 1
          fi
          mkdir -p installers
          cp "${FILES[@]}" installers/
          printf 'collected %s\n' "${FILES[@]}"

      - name: Hand the installers to publish-desktop
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-installers-${{ matrix.name }}
          path: installers/
          if-no-files-found: error
          retention-days: 1

  # Attaches what the desktop legs built to the release. Apart from `verify`,
  # the only job that can write to it, and neither installs a package.
  #
  # `always()` keeps each platform shipping on its own, as it did when every
  # leg uploaded for itself: a failed macOS build does not hold back the
  # Windows installers. A cancelled run is left alone.
  publish-desktop:
    name: Attach the desktop installers
    runs-on: ubuntu-latest
    needs: desktop
    if: always() && needs.desktop.result != 'cancelled'
    permissions:
      contents: write
    steps:
      - name: Download the installers
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: desktop-installers-*
          merge-multiple: true
          path: installers

      - name: Attach them to the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Release tag must be vMAJOR.MINOR.PATCH; received '$TAG'."
            exit 1
          fi
          shopt -s nullglob
          FILES=(installers/*)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "::error::No desktop build produced installers to attach."
            exit 1
          fi
          printf 'uploading %s\n' "${FILES[@]}"
          gh release upload "$TAG" "${FILES[@]}" --clobber --repo "$GITHUB_REPOSITORY"

  # Fails the run if any image is missing, so a green tick means all three are
  # actually in the registry. Without this, fail-fast:false would let a partial
  # release report success.
  verify:
    name: All images published
    runs-on: ubuntu-latest
    needs: build
    if: ${{ always() && !inputs.desktop_only }}
    permissions:
      contents: write
    steps:
      - name: Check the build results
        shell: bash
        run: |
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "::error::One or more images failed to build. This release is NOT deployable."
            exit 1
          fi
          echo "api, web and dashboard all published."

      # A Release object exists before its images finish building. The worker
      # requires this asset as proof that the all-images gate above completed;
      # image manifests are checked independently as a second guard.
      - name: Check out the deployment worker
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Pin the package to the exact commit containing the workflow that
          # authorized it; the default branch could advance while images build.
          ref: ${{ github.workflow_sha }}
          # The upload below authenticates with GH_TOKEN, not git.
          persist-credentials: false

      - name: Download verified image digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-digest-*
          merge-multiple: true

      - name: Publish the deployable marker and Windows worker
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Release tag must be vMAJOR.MINOR.PATCH; received '$TAG'."
            exit 1
          fi

          MARKER="virgo-deployable-$TAG.json"
          PACKAGE="virgo-production-worker-$TAG.zip"
          CHECKSUM="$PACKAGE.sha256"
          API_DIGEST="$(cat virgo-api.digest)"
          WEB_DIGEST="$(cat virgo-web.digest)"
          DASHBOARD_DIGEST="$(cat virgo-dashboard.digest)"
          for DIGEST in "$API_DIGEST" "$WEB_DIGEST" "$DASHBOARD_DIGEST"; do
            if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::Invalid image digest '$DIGEST'."
              exit 1
            fi
          done
          (cd deployment/windows && zip -q -r "$GITHUB_WORKSPACE/$PACKAGE" \
            deploy.ps1 check-release.ps1 initialize-deployment.ps1 \
            register-deployment-task.ps1 set-github-token.ps1 scripts)
          PACKAGE_SHA256="$(sha256sum "$PACKAGE" | awk '{print $1}')"
          printf '%s  %s\n' "$PACKAGE_SHA256" "$PACKAGE" > "$CHECKSUM"
          cat > "$MARKER" <<EOF
          {
            "tag": "$TAG",
            "workflowRunId": "${{ github.run_id }}",
            "workflowRunAttempt": "${{ github.run_attempt }}",
            "repository": "${{ github.repository }}",
            "workerSha256": "$PACKAGE_SHA256",
            "images": {
              "api": "$API_DIGEST",
              "web": "$WEB_DIGEST",
              "dashboard": "$DASHBOARD_DIGEST"
            }
          }
          EOF

          gh release upload "$TAG" "$MARKER" "$PACKAGE" "$CHECKSUM" --clobber --repo "$GITHUB_REPOSITORY"
