# Announces an app update to the clients it concerns.
#
# Run after an update is live — a release deployed, an OTA published, a new
# build in the stores. It posts one announcement to the API, which shows it in
# the notification list of every client matching its platforms and versions,
# and pushes it to matching phones.
#
# The targeting is the reason this is a step of its own. A release rebuilds the
# web app and every desktop installer whether or not it changed them, so which
# platforms an update actually touched is a judgement made by whoever shipped
# it — not something the release can work out for itself.
#
# See docs/APP_UPDATES.md.

name: Announce an update

on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'Unique id — posting the same one twice is a no-op. e.g. v1.12.9-web or ota-1.3.4-images'
        required: true
        type: string
      platforms:
        description: 'Comma-separated, any of: web, windows, macos, ios, android'
        required: true
        type: string
      title:
        description: 'One line, up to 80 characters — the first line of a phone notification'
        required: true
        type: string
      body:
        description: 'What changed, in the reader''s terms, up to 600 characters'
        required: true
        type: string
      version:
        description: 'The version this update brings, for display (optional)'
        required: false
        type: string
      min_version:
        description: 'Only clients at or above this version (optional). An OTA sets min and max to the one version it reaches.'
        required: false
        type: string
      max_version:
        description: 'Only clients at or below this version (optional). A new build sets this to the version before it.'
        required: false
        type: string
      url:
        description: 'https link opened from the announcement (optional). The desktop app only opens api.virgo.ph links.'
        required: false
        type: string
      push:
        description: 'Also push to the phones it concerns'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  announce:
    name: Post the announcement
    runs-on: ubuntu-latest
    steps:
      # Every input arrives through the environment and is never pasted into the
      # script. An announcement's text is free-form, and one interpolated into a
      # shell line would run as shell before anything had the chance to refuse
      # it — the same rule the release workflow follows for tags.
      - name: Post to the API
        shell: bash
        env:
          TOKEN: ${{ secrets.APP_UPDATES_TOKEN }}
          API_URL: ${{ vars.PROD_API_URL || 'https://api.virgo.ph' }}
          SLUG: ${{ inputs.slug }}
          PLATFORMS: ${{ inputs.platforms }}
          TITLE: ${{ inputs.title }}
          BODY: ${{ inputs.body }}
          VERSION: ${{ inputs.version }}
          MIN_VERSION: ${{ inputs.min_version }}
          MAX_VERSION: ${{ inputs.max_version }}
          LINK: ${{ inputs.url }}
          PUSH: ${{ inputs.push }}
        run: |
          set -euo pipefail
          if [ -z "$TOKEN" ]; then
            echo "::error::APP_UPDATES_TOKEN is not set. See docs/APP_UPDATES.md for the one-time setup."
            exit 1
          fi

          # Built in Node from the environment, so quotes and newlines in the
          # text cannot break the JSON. Empty optional fields are left out
          # rather than sent as empty strings, which the API would refuse.
          node -e '
            const e = process.env;
            const opt = (v) => (v && v.trim() ? v.trim() : undefined);
            const payload = {
              slug: e.SLUG.trim(),
              platforms: e.PLATFORMS.split(",").map((p) => p.trim()).filter(Boolean),
              title: e.TITLE,
              body: e.BODY,
              version: opt(e.VERSION),
              minVersion: opt(e.MIN_VERSION),
              maxVersion: opt(e.MAX_VERSION),
              url: opt(e.LINK),
              push: e.PUSH !== "false",
            };
            process.stdout.write(JSON.stringify(payload));
          ' > payload.json

          # The token goes in a header file rather than on the command line,
          # so it never appears in the runner's process list.
          umask 077
          printf 'Authorization: Bearer %s\n' "$TOKEN" > auth-header

          status=$(curl -sS -o response.json -w '%{http_code}' \
            -X POST "$API_URL/internal/app-updates" \
            -H @auth-header \
            -H 'Content-Type: application/json' \
            --data @payload.json)
          rm -f auth-header

          echo "API answered $status:"
          cat response.json; echo
          if [ "$status" != "200" ]; then
            echo "::error::The announcement was not posted (HTTP $status)."
            exit 1
          fi
