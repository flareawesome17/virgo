# Applied to every service below via `<<: *hardening`.
#
# no-new-privileges stops a process inside a container gaining rights through a
# setuid binary, which is the cheap half of container hardening and costs
# nothing to switch on.
#
# The log limits are not cosmetic: Docker's default json-file driver grows
# without bound, and this stack runs on one always-on machine. A chatty loop
# in any service fills the disk, and a full disk takes Postgres down with it.
x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: '10m'
      max-file: '5'

services:
  postgres:
    <<: *hardening
    # Pinned by digest. `postgres:17-alpine` is a moving tag: it would carry a
    # new patch on any `docker compose pull`, and the database is the one
    # service where an unreviewed image change is least welcome.
    image: postgres@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    container_name: virgo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-virgo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-virgo_dev_password}
      # `virgo_dev`, not `virgo`.
      #
      # Production names its database explicitly and has no default at all —
      # see docker-compose.prod.yml, where POSTGRES_DB uses `:?`. The two
      # together mean a connection string can never quietly resolve to the
      # wrong environment: a dev stack missing its variable lands on
      # `virgo_dev`, and a production stack missing it refuses to start.
      #
      # Renamed from `virgo` in place (ALTER DATABASE). If you have a
      # host-side DATABASE_URL in api/.env, point it at virgo_dev too — the
      # api container does not read it (the environment block below wins), but
      # anything you run outside compose does.
      POSTGRES_DB: ${POSTGRES_DB:-virgo_dev}
    ports:
      # Bound to loopback, not 0.0.0.0. It was reachable from anything on the
      # same network, and the password in this file is a default that anyone
      # with the repo can read — two facts that are survivable apart and not
      # together. Nothing legitimate needed the LAN: the API reaches Postgres
      # over the compose network by service name, and psql on this machine
      # still connects through localhost.
      #
      # Standard 5432. Override POSTGRES_PORT if another Postgres ever claims
      # it — and remember to update DATABASE_URL in .env to match, since that
      # is the host-side connection string.
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - virgo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-virgo} -d ${POSTGRES_DB:-virgo_dev}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    <<: *hardening
    build:
      context: .
      dockerfile: Dockerfile
    container_name: virgo-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # OVERRIDES .env. Inside the compose network Postgres answers on its
      # service name at its *container* port — the 5434 host mapping does not
      # exist in here, and `localhost` would be this container itself.
      DATABASE_URL: postgresql://${POSTGRES_USER:-virgo}:${POSTGRES_PASSWORD:-virgo_dev_password}@postgres:5432/${POSTGRES_DB:-virgo_dev}
      NODE_ENV: production
      # NODE_ENV=production disables auto-migrate, so switch it back on
      # explicitly. Safe with a single replica; if you ever scale this service,
      # move migrations to a release step — concurrent runners race.
      # Defaults to true, which is correct while api.virgo.ph still routes to
      # this machine: behind cloudflared every request arrives from the local
      # daemon, so without this the whole user base shares one rate-limit
      # bucket.
      #
      # Set TRUST_PROXY=false in api/.env together with DEV_BIND=0.0.0.0 above.
      # The two belong to the same moment and neither is safe alone: a published
      # port with the header still trusted lets a LAN caller forge
      # CF-Connecting-IP and never hit a limit, and an untrusted header while
      # still behind the tunnel buckets everybody together.
      TRUST_PROXY: ${TRUST_PROXY:-true}
    ports:
      # On the LAN, not just loopback, so a physical phone can reach this API
      # during development. Production hostnames belong to the production
      # machine now, so `api.virgo.ph` is no longer this stack's address and a
      # device needs somewhere else to point.
      #
      # Still not something to forward on your router. LAN means the machines
      # in your home, and the rate limiter stops reading CF-Connecting-IP when
      # TRUST_PROXY is off (below) precisely because a directly-reachable port
      # lets a caller set that header itself.
      #
      # DEV_BIND covers api, web and dashboard together. Defaults to loopback;
      # set DEV_BIND=0.0.0.0 in api/.env to reach them from a phone on the LAN,
      # together with TRUST_PROXY=false below.
      - '${DEV_BIND:-127.0.0.1}:${API_PORT:-3000}:3000'
    depends_on:
      postgres:
        # Wait for real readiness, not just "container started" — otherwise
        # boot-time migrations hit a Postgres that is still initialising.
        condition: service_healthy

  # Cloudflare Tunnel — publishes the API at your public hostname without
  # opening a single inbound port. cloudflared dials OUT to Cloudflare and
  # traffic returns down that connection, so there is no port forwarding, no
  # firewall hole, and your origin IP is never exposed.
  #
  # Routing is configured in the Cloudflare dashboard (token-based tunnels are
  # remotely managed, so it does not live in this file):
  #
  #   Public hostname : api.virgo.ph
  #   Service         : http://api:3000
  #
  # Note `api:3000`, NOT host.docker.internal:3000 — now that the API runs in
  # this compose network, cloudflared reaches it by service name and the
  # traffic never leaves Docker.
  #
  # Keep port 3000 unforwarded at the router — the tunnel is the only ingress,
  # and CF-Connecting-IP can only be trusted while that stays true.
  # The Next.js app in ../web.
  #
  # Its own Node server rather than a static export: the app has dynamic
  # routes, and `next start` is what Next supports for them.
  #
  # NEXT_PUBLIC_API_URL is a *build* argument, not a runtime variable — Next
  # inlines NEXT_PUBLIC_* values into the client bundle at build time. Changing
  # it means rebuilding the image, not restarting the container.
  #
  # Add the tunnel route in the Cloudflare Zero Trust dashboard:
  #
  #   Public hostname : web.virgo.ph
  #   Service         : http://web:3000
  #
  # And add https://web.virgo.ph to CORS_ORIGINS in api/.env, or the browser
  # blocks every API call before it leaves the page.
  web:
    <<: *hardening
    build:
      context: ../web
      args:
        NEXT_PUBLIC_API_URL: ${WEB_API_URL:-https://api.virgo.ph}
        # Analytics. Inlined at build time like every NEXT_PUBLIC_ value, so a
        # key added to .env after the image was built does nothing until the
        # image is rebuilt. Absent, the app runs with analytics switched off
        # rather than failing — see web/src/lib/analytics.ts.
        NEXT_PUBLIC_POSTHOG_KEY: ${POSTHOG_KEY:-}
        NEXT_PUBLIC_POSTHOG_HOST: ${POSTHOG_HOST:-https://us.i.posthog.com}
    container_name: virgo-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # The API over the container network, for pages rendered on the server.
      # Without it the landing page reads its own backend by going out through
      # Cloudflare and back, which is slower and fails whenever the public
      # hostname is having a bad day. Falls back to the public URL if unset.
      API_INTERNAL_URL: http://api:3000
    # Published, not merely exposed. `expose` only opens a port to the other
    # containers, so with the tunnel gone this app was unreachable — including
    # from a browser on this very machine.
    ports:
      - '${DEV_BIND:-127.0.0.1}:${WEB_PORT:-3005}:3000'
    depends_on:
      - api

  # The management console, for console.virgo.ph.
  #
  # SECURITY: this is the platform's admin panel on a public hostname. It has
  # its own credentials, its own signing key and role-based permissions, and
  # none of that helps if someone finds an unpatched hole — put Cloudflare
  # Access in front of console.virgo.ph as well, the same way db.virgo.ph
  # should have it. Defence in depth costs nothing here; it is free on the plan
  # the tunnel already uses.
  dashboard:
    <<: *hardening
    build:
      context: ../dashboard
      args:
        NEXT_PUBLIC_API_URL: ${WEB_API_URL:-https://api.virgo.ph}
    container_name: virgo-dashboard
    restart: unless-stopped
    environment:
      NODE_ENV: production
    # 3002 inside and out: the tunnel route for console.virgo.ph pointed at
    # `dashboard:3002`, and keeping the same number on the host means one port
    # to remember rather than two.
    #
    # Published for the same reason as web above — `expose` alone left it
    # reachable only through the tunnel.
    ports:
      - '${DEV_BIND:-127.0.0.1}:${DASHBOARD_PORT:-3002}:3002'
    depends_on:
      - api

  # Database admin console, for db.virgo.ph.
  #
  # SECURITY: this is a full read/write console on the production database, and
  # putting it on a public hostname puts that console on the open internet.
  # Its own login is the only thing in front of it, so PGADMIN_PASSWORD is
  # effectively a second database password — treat it as one.
  #
  # Put Cloudflare Access in front of db.virgo.ph. It is free on the plan you
  # already have for the tunnel, and it means the console is never reachable
  # without your identity provider saying so first, rather than relying on one
  # form that anybody on earth can submit to.
  pgadmin:
    # Logging only — deliberately NOT the shared *hardening anchor.
    #
    # no-new-privileges breaks this image. Its entrypoint uses sudo to bind
    # port 80, and with the flag set that fails; rather than exit, it silently
    # falls back to listening on 8080. Nothing errors, the container reports
    # healthy, and both the host mapping and the tunnel route point at a port
    # nothing is on — db.virgo.ph returned 502 with a container that looked
    # fine. Found by restarting the stack and checking, not by reading.
    #
    # To harden it properly: set PGADMIN_LISTEN_PORT=8080, map 5050:8080, add
    # the flag back, and repoint the db.virgo.ph tunnel route at
    # http://pgadmin:8080 in the Cloudflare dashboard. All four, or it breaks
    # again — the route is the part this file cannot change.
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
    # Pinned by digest. `:latest` on a database console reachable from a
    # public hostname means a restart can silently swap in an unreviewed
    # major version; bump this deliberately after reading the release notes.
    image: dpage/pgadmin4@sha256:2f4ce946ddf8360680d7eff4eaba1d91859eb6b4003e6623bad5c63a322c2f4d
    container_name: virgo-pgadmin
    restart: unless-stopped
    environment:
      # No defaults, deliberately. A default password on a database console is
      # how these end up compromised; compose should refuse to start instead.
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:?set PGADMIN_EMAIL in api/.env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?set PGADMIN_PASSWORD in api/.env}
      # Behind the tunnel every request arrives from cloudflared over http, so
      # without these pgAdmin builds its redirects from the wrong scheme and
      # bounces a https visitor into a redirect loop.
      PGADMIN_CONFIG_PROXY_X_FOR_COUNT: 1
      PGADMIN_CONFIG_PROXY_X_PROTO_COUNT: 1
      PGADMIN_CONFIG_PROXY_X_HOST_COUNT: 1
      PGADMIN_CONFIG_PROXY_X_PORT_COUNT: 1
      PGADMIN_CONFIG_PROXY_X_PREFIX_COUNT: 1
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: 'True'
    ports:
      # Host-side access for when the tunnel is down or you are at the machine.
      - '127.0.0.1:${PGADMIN_PORT:-5050}:80'
    volumes:
      # pgAdmin's own settings and query history. Without it every restart
      # forgets the server registration and any saved queries.
      - virgo_pgadmin:/var/lib/pgadmin
      # Pre-registers the Virgo database so there is nothing to fill in but the
      # password. pgAdmin deliberately ignores any password in this file.
      - ./pgadmin-servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  cloudflared:
    <<: *hardening
    # Behind a profile, so `docker compose up -d` does NOT start it.
    #
    # The public hostnames belong to the production machine. This stack is
    # local — localhost and the LAN — and leaving the connector in the default
    # set would mean any routine `up` here quietly claiming those names back.
    #
    # Start it deliberately, when the LAN is not usable from a phone:
    #
    #   docker compose --profile tunnel up -d cloudflared
    #
    # DEV_TUNNEL_TOKEN, not CLOUDFLARE_TUNNEL_TOKEN. This must be a *second*
    # tunnel, its own token, carrying only development hostnames:
    #
    #   dev.virgo.ph      -> http://host.docker.internal:8081   (Metro)
    #   dev-api.virgo.ph  -> http://api:3000                    (optional)
    #
    # The separate variable is the safety property. Two connectors sharing one
    # token are replicas and Cloudflare load-balances between them, so booting
    # this with production's token would put half of production's traffic on
    # this machine. A different name means that cannot happen by accident —
    # the value simply is not here to be picked up.
    profiles: ['tunnel']
    # Pinned by digest — this process is the ingress for every hostname, so
    # it should change when you decide it does, not when a restart happens.
    image: cloudflare/cloudflared@sha256:e39ee8da81ad5e05d77f38d2f51c60ca51bf2a8450ac3abab50c17fdb91d91bf
    container_name: virgo-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in api/.env}
    depends_on:
      - api
      - web
      - pgadmin
    extra_hosts:
      # cloudflared runs in Docker; Metro runs on the Windows host, so the
      # tunnel needs this name to reach port 8081.
      - 'host.docker.internal:host-gateway'

volumes:
  virgo_pgdata:
  virgo_pgadmin:
